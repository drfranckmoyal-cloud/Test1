<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Archivo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E0B44A; text-decoration: none; } a:hover { color: #F5D68A; }
    * { box-sizing: border-box; }
    .lbl { font-size: 10px; font-weight: 800; letter-spacing: 0.24em; color: #6E6875; }
    .kit { height: 62px; border-radius: 10px; background: #151318; border: 1px solid #23202A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
    .kit span { font-size: 9px; font-weight: 700; color: #8E8894; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0A0C; color: #F4F1EC; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; top: -80px; left: 50%; width: 560px; height: 560px; transform: translateX(-50%); background: radial-gradient(circle, rgba(224,180,74,0.20) 0%, rgba(224,180,74,0) 64%); pointer-events: none;"></div>

  <!-- rang -->
  <div style="position: relative; display: flex; align-items: center; gap: 16px; padding: 30px 20px 0 20px;">
    <div style="width: 82px; height: 82px; border-radius: 6px; background: linear-gradient(158deg, #E8C568, #A97C17); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 6px 20px rgba(224,180,74,0.26);">
      <span style="font-family: 'Dela Gothic One', sans-serif; font-size: 40px; color: #1A1509;">B</span>
    </div>
    <div style="flex-grow: 1;">
      <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px;">NIVEAU 23</div>
      <div style="font-size: 11px; font-weight: 700; color: #8E8894; margin-top: 4px;">31 480 XP · 4 520 avant le niveau 24</div>
      <div style="height: 7px; border-radius: 4px; background: #1E1B22; margin-top: 9px; overflow: hidden;">
        <div style="height: 100%; width: 68%; border-radius: 4px; background: linear-gradient(90deg, #E0B44A, #F5D68A);"></div>
      </div>
    </div>
  </div>

  <!-- radar -->
  <div style="position: relative; padding: 26px 20px 0 20px;">
    <div class="lbl" style="margin-bottom: 10px;">CARACTÉRISTIQUES</div>
    <div style="display: flex; align-items: center; gap: 18px; background: #121014; border: 1px solid #23202A; border-radius: 12px; padding: 16px;">
      <svg width="180" height="180" viewBox="0 0 180 180" style="flex-shrink: 0;">
        <polygon points="90,20 150.6,125 29.4,125" fill="none" style="stroke: #2A2630; stroke-width: 1;"></polygon>
        <polygon points="90,43.3 130.4,113.4 49.6,113.4" fill="none" style="stroke: #2A2630; stroke-width: 1;"></polygon>
        <polygon points="90,66.7 110.2,101.7 69.8,101.7" fill="none" style="stroke: #2A2630; stroke-width: 1;"></polygon>
        <path d="M90 90 L90 20 M90 90 L150.6 125 M90 90 L29.4 125" style="stroke: #2A2630; stroke-width: 1;"></path>
        <polygon points="90,46.6 113,103.3 45.1,115.9" style="fill: rgba(224,180,74,0.28); stroke: #E0B44A; stroke-width: 2; stroke-linejoin: round;"></polygon>
        <circle cx="90" cy="46.6" r="3.5" style="fill: #E0B44A;"></circle>
        <circle cx="113" cy="103.3" r="3.5" style="fill: #E0B44A;"></circle>
        <circle cx="45.1" cy="115.9" r="3.5" style="fill: #E0B44A;"></circle>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">
        <div>
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #8E8894;">FORCE</div>
          <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 26px; color: #E0B44A; line-height: 1.1;">62</div>
        </div>
        <div>
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #8E8894;">VITESSE</div>
          <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 26px; color: #E0B44A; line-height: 1.1;">38</div>
        </div>
        <div>
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #8E8894;">ENDURANCE</div>
          <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 26px; color: #E0B44A; line-height: 1.1;">74</div>
        </div>
      </div>
    </div>
  </div>

  <!-- équipement -->
  <div style="position: relative; padding: 24px 20px 0 20px;">
    <div class="lbl" style="margin-bottom: 10px;">ÉQUIPEMENT DÉBLOQUÉ · 3 / 8</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px;">
      <div class="kit" style="border-color: rgba(224,43,32,0.4);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #E02B20; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M3 9h18M3 9l2 6h14l2-6M8 9V7M16 9V7"></path></svg>
        <span style="color: #C7A9A6;">Bandeau</span>
      </div>
      <div class="kit" style="border-color: rgba(245,176,65,0.4);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #F5B041; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><rect x="5" y="8" width="14" height="9" rx="2"></rect><path d="M9 8V6h6v2"></path></svg>
        <span style="color: #C7BFA8;">Lests</span>
      </div>
      <div class="kit" style="border-color: rgba(224,180,74,0.4);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #E0B44A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 20L18 6M14 4h6v6"></path></svg>
        <span style="color: #C9BE9C;">Sabre</span>
      </div>
      <div class="kit">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #4E4956; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <span style="color: #4E4956;">5 autres</span>
      </div>
    </div>
  </div>

  <!-- badges -->
  <div style="position: relative; padding: 24px 20px 0 20px;">
    <div class="lbl" style="margin-bottom: 10px;">HAUTS FAITS</div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px; border-radius: 9px; background: #151318; border: 1px solid #23202A;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="fill: #E0B44A;"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"></path></svg>
        <span style="flex-grow: 1; font-size: 13px; font-weight: 700;">Trente jours d'affilée</span>
        <span style="font-size: 11px; font-weight: 700; color: #6E6875;">12 sept.</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px; border-radius: 9px; background: #151318; border: 1px solid #23202A;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="fill: #E0B44A;"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"></path></svg>
        <span style="flex-grow: 1; font-size: 13px; font-weight: 700;">Saitama : programme bouclé</span>
        <span style="font-size: 11px; font-weight: 700; color: #6E6875;">28 août</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #1E1B22; background: #0F0E11; padding: 10px 12px 26px 12px;">
    <div style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" style="stroke: #6E6875; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 13h3l2-5 3 9 2.5-6 1.5 2h4"></path></svg>
      <span style="font-size: 10px; font-weight: 700; color: #6E6875;">Séance</span>
    </div>
    <div style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" style="stroke: #6E6875; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><rect x="3" y="4" width="7" height="7" rx="1.5"></rect><rect x="14" y="4" width="7" height="7" rx="1.5"></rect><rect x="3" y="15" width="7" height="7" rx="1.5"></rect><rect x="14" y="15" width="7" height="7" rx="1.5"></rect></svg>
      <span style="font-size: 10px; font-weight: 700; color: #6E6875;">Programmes</span>
    </div>
    <div style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" style="stroke: #E0B44A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg>
      <span style="font-size: 10px; font-weight: 700; color: #E0B44A;">Profil</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
