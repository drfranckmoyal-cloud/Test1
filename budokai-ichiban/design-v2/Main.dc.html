<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Archivo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E02B20; text-decoration: none; } a:hover { color: #FF5A4A; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0A0C; color: #F4F1EC; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- rayons -->
  <div style="position: absolute; top: 180px; left: 50%; width: 900px; height: 900px; transform: translateX(-50%); background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(224,43,32,0.16) 0deg 5deg, rgba(224,43,32,0) 5deg 13deg); pointer-events: none;"></div>
  <!-- trame de points -->
  <div style="position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(244,241,236,0.10) 1px, transparent 1.1px); background-size: 7px 7px; pointer-events: none;"></div>
  <!-- voile bas -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(180deg, rgba(11,10,12,0) 0%, #0B0A0C 62%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 64px 26px 0 26px;">

    <!-- sceau + kanji -->
    <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 250px; height: 250px;">
      <div style="position: absolute; width: 186px; height: 186px; background: #E02B20; transform: rotate(-4deg);"></div>
      <div style="position: absolute; width: 186px; height: 186px; border: 2px solid rgba(244,241,236,0.30); transform: rotate(3deg);"></div>
      <span style="position: relative; font-family: 'Dela Gothic One', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 152px; line-height: 1; color: #F4F1EC; text-shadow: 5px 6px 0 rgba(11,10,12,0.55);">武</span>
    </div>

    <!-- le trait ichi -->
    <div style="width: 214px; height: 11px; background: #F4F1EC; margin-top: 26px; transform: skewX(-14deg);"></div>

    <div style="font-family: 'Dela Gothic One', 'Hiragino Sans', sans-serif; font-size: 33px; letter-spacing: 0.05em; margin-top: 22px; text-align: center;">BUDOKAI ICHI</div>
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.42em; color: #8E8894; margin-top: 10px;">武 道 会 一</div>
    <div style="font-size: 13px; font-weight: 500; color: #8E8894; margin-top: 16px; text-align: center; max-width: 260px; line-height: 1.45;">L'assemblée des arts martiaux. Huit maîtres, une seule échelle.</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- échelle des rangs -->
  <div style="position: relative; padding: 0 26px 46px 26px; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.28em; color: #6E6875;">LES RANGS</div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
      <div style="height: 46px; border-radius: 3px; background: #2A2630; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 17px; color: #8E8894;">E</div>
      <div style="height: 46px; border-radius: 3px; background: #2A2630; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 17px; color: #8E8894;">D</div>
      <div style="height: 46px; border-radius: 3px; background: #2A2630; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 17px; color: #8E8894;">C</div>
      <div style="height: 46px; border-radius: 3px; background: #2A2630; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 17px; color: #8E8894;">B</div>
      <div style="height: 46px; border-radius: 3px; background: #2A2630; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 17px; color: #8E8894;">A</div>
      <div style="height: 46px; border-radius: 3px; background: linear-gradient(160deg, #E0B44A, #A97C17); display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 17px; color: #17140F;">S</div>
      <div style="height: 46px; border-radius: 3px; background: #F4F1EC; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 15px; color: #0B0A0C;">S+</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
