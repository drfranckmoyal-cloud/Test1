# La version web du défi est un site statique : rien à compiler,
# on publie simplement son dossier web/.
[build]
  publish = "defi-100-pompes/web"
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
