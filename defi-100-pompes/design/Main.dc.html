<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FF8A3D; text-decoration: none; }
    a:hover { color: #FFB067; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14100E; color: #FCF3EA; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; top: -160px; left: -60px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255,107,26,0.22) 0%, rgba(255,107,26,0) 68%); pointer-events: none;"></div>

  <!-- header -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 22px 0 22px; position: relative;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Archivo Black', 'Helvetica Neue', system-ui, sans-serif; font-size: 22px; letter-spacing: -0.5px; line-height: 1;">JOUR 18</div>
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: #8E7A6C;">SUR 30 · 100 POMPES / JOUR</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,107,26,0.14); border: 1px solid rgba(255,107,26,0.32);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="stroke: #FF8A3D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
        <path d="M12 3c.7 3 2.4 4.1 3.8 5.6A7.5 7.5 0 0 1 18 13.8 6 6 0 0 1 6 13.8c0-2.2 1.1-3.6 2.2-5C9.6 7 10 5.3 12 3Z"></path>
        <path d="M12 21a3 3 0 0 0 3-3c0-1.4-1-2.2-1.6-3-.5.9-1.4 1.2-1.4 1.2s-1.4-.7-1.4-2.2C9.4 15 9 16.6 9 18a3 3 0 0 0 3 3Z"></path>
      </svg>
      <span style="font-family: 'Archivo Black', system-ui, sans-serif; font-size: 14px; color: #FF8A3D;">6</span>
      <span style="font-size: 11px; font-weight: 600; color: #C29A7E; letter-spacing: 0.4px;">jours</span>
    </div>
  </div>

  <!-- ring -->
  <div style="display: flex; flex-direction: column; align-items: center; padding: 18px 22px 0 22px; position: relative;">
    <div style="position: relative; width: 268px; height: 268px;">
      <svg width="268" height="268" viewBox="0 0 268 268" style="transform: rotate(-90deg);">
        <circle cx="134" cy="134" r="113" fill="none" style="stroke: #251C17; stroke-width: 20px;"></circle>
        <circle cx="134" cy="134" r="113" fill="none" style="stroke: {{accent}}; stroke-width: 20px; stroke-linecap: round; stroke-dasharray: {{ring.total}}; stroke-dashoffset: {{ring.offset}};"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <div style="font-family: 'Archivo Black', 'Helvetica Neue', system-ui, sans-serif; font-size: 88px; line-height: 0.9; letter-spacing: -3px; color: {{accent}};">{{count}}</div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 2.4px; color: #8E7A6C;">SUR {{goal}} POMPES</div>
        <div style="margin-top: 10px; font-size: 13px; font-weight: 600; color: #FCF3EA; background: #251C17; padding: 6px 14px; border-radius: 999px;">{{remainingLabel}}</div>
      </div>
    </div>
  </div>

  <!-- quick add -->
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 22px 22px 0 22px;">
    <button onClick="{{addOne}}" style="height: 52px; border: 1px solid #33261E; background: #1D1611; color: #FCF3EA; border-radius: 16px; font-family: Archivo, system-ui, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;">+1</button>
    <button onClick="{{addFive}}" style="height: 52px; border: 1px solid #33261E; background: #1D1611; color: #FCF3EA; border-radius: 16px; font-family: Archivo, system-ui, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;">+5</button>
    <button onClick="{{addTen}}" style="height: 52px; border: 1px solid #33261E; background: #1D1611; color: #FCF3EA; border-radius: 16px; font-family: Archivo, system-ui, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;">+10</button>
    <button onClick="{{addTwenty}}" style="height: 52px; border: 1px solid #33261E; background: #1D1611; color: #FCF3EA; border-radius: 16px; font-family: Archivo, system-ui, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;">+20</button>
  </div>

  <div style="display: flex; gap: 10px; padding: 10px 22px 0 22px;">
    <button onClick="{{addSet}}" style="flex-grow: 1; height: 58px; border: none; border-radius: 18px; background: {{accent}}; color: #14100E; font-family: 'Archivo Black', system-ui, sans-serif; font-size: 16px; letter-spacing: 0.4px; cursor: pointer;">ENREGISTRER UNE SÉRIE</button>
    <button onClick="{{reset}}" aria-label="Remettre à zéro" style="width: 58px; height: 58px; border: 1px solid #33261E; background: #1D1611; border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="stroke: #8E7A6C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
        <path d="M3 12a9 9 0 1 0 3-6.7"></path>
        <path d="M3 4v5h5"></path>
      </svg>
    </button>
  </div>

  <!-- motivation -->
  <div style="margin: 18px 22px 0 22px; padding: 16px 18px; border-radius: 20px; background: linear-gradient(135deg, rgba(255,107,26,0.16), rgba(255,163,61,0.06)); border: 1px solid rgba(255,107,26,0.22); display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #FF8A3D;">MOTIVATION DU JOUR</div>
    <div style="font-size: 15px; font-weight: 600; line-height: 1.35; color: #FCF3EA; text-wrap: pretty;">Plus que 37. C'est 3 minutes de ta journée, pas plus.</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- month progress -->
  <div style="padding: 0 22px 16px 22px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #8E7A6C;">DÉFI 30 JOURS</span>
      <span style="font-size: 13px; font-weight: 700; color: #FCF3EA;">15 <span style="color: #8E7A6C; font-weight: 600;">/ 30 jours validés</span></span>
    </div>
    <div style="height: 10px; border-radius: 5px; background: #251C17; overflow: hidden; display: flex;">
      <div style="width: 50%; background: linear-gradient(90deg, #FF6B1A, #FFA33D); border-radius: 5px;"></div>
    </div>
  </div>

  <!-- tab bar -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #251C17; background: #100C0A; padding: 10px 12px 22px 12px;">
    <div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #FF6B1A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
        <path d="M4 13h3l2-5 3 9 2.5-6 1.5 2h4"></path>
      </svg>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: #FF6B1A;">Aujourd'hui</span>
    </div>
    <div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #6B5B50; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
        <rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path>
      </svg>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: #6B5B50;">Calendrier</span>
    </div>
    <div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #6B5B50; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
        <path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path><path d="M10.5 20a2 2 0 0 0 3 0"></path>
      </svg>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: #6B5B50;">Rappels</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844},"accent":{"editor":"color","default":"#FF6B1A","options":["#FF6B1A","#F2540B","#FF8A3D","#E8460A"]},"goal":{"editor":"int","default":100,"min":10,"max":300,"step":10}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { count: 63 };
  }
  add(n) {
    const goal = this.props.goal ?? 100;
    this.setState({ count: Math.max(0, Math.min(goal, this.state.count + n)) });
  }
  renderVals() {
    const goal = this.props.goal ?? 100;
    const count = Math.min(this.state.count, goal);
    const r = 113;
    const total = 2 * Math.PI * r;
    const pct = goal > 0 ? count / goal : 0;
    const remaining = Math.max(0, goal - count);
    return {
      accent: this.props.accent ?? '#FF6B1A',
      goal: goal,
      count: count,
      ring: { total: total.toFixed(1), offset: (total * (1 - pct)).toFixed(1) },
      remainingLabel: remaining === 0 ? 'Objectif atteint' : remaining + ' pompes restantes',
      addOne: () => this.add(1),
      addFive: () => this.add(5),
      addTen: () => this.add(10),
      addTwenty: () => this.add(20),
      addSet: () => this.add(25),
      reset: () => this.setState({ count: 0 })
    };
  }
}
</script>
</body>
</html>
