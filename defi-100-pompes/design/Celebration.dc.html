<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4A1B00; text-decoration: none; }
    a:hover { color: #1A0F07; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: linear-gradient(168deg, #FF8A3D 0%, #FF6B1A 42%, #DB3F06 100%); color: #2A1204; display: flex; flex-direction: column; align-items: center; overflow: hidden; position: relative;">

  <!-- rayons -->
  <svg width="720" height="720" viewBox="0 0 720 720" style="position: absolute; top: 34px; left: -165px; opacity: 0.16; pointer-events: none;">
    <g style="fill: #FFF3E6;">
      <path d="M360 360 322 0h76z"></path>
      <path d="M360 360 490 18l70 30z"></path>
      <path d="M360 360 630 130l48 60z"></path>
      <path d="M360 360 706 300l10 76z"></path>
      <path d="M360 360 660 570l-42 64z"></path>
      <path d="M360 360 400 716h-76z"></path>
      <path d="M360 360 106 620l-56-52z"></path>
      <path d="M360 360 16 424 4 350z"></path>
      <path d="M360 360 62 148l50-58z"></path>
    </g>
  </svg>

  <div style="height: 78px;"></div>

  <!-- badge étoile -->
  <div style="position: relative; width: 168px; height: 168px; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; inset: 0; border-radius: 50%; background: rgba(255,243,230,0.20);"></div>
    <div style="position: absolute; inset: 16px; border-radius: 50%; background: rgba(255,243,230,0.28);"></div>
    <svg width="104" height="104" viewBox="0 0 24 24" style="fill: #FFF3E6; position: relative;">
      <path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"></path>
    </svg>
  </div>

  <div style="height: 26px;"></div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 3px; color: rgba(42,18,4,0.62);">JOUR 18 SUR 30</div>
    <div style="font-family: 'Archivo Black', 'Helvetica Neue', system-ui, sans-serif; font-size: 60px; line-height: 0.94; letter-spacing: -2.4px; color: #2A1204;">VALIDÉ</div>
  </div>

  <div style="height: 26px;"></div>

  <div style="width: 100%; padding: 0 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; position: relative;">
    <div style="padding: 16px 18px; border-radius: 22px; background: rgba(255,243,230,0.24); display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: 'Archivo Black', system-ui, sans-serif; font-size: 30px; line-height: 1; color: #2A1204;">100</span>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: rgba(42,18,4,0.68);">POMPES AUJOURD'HUI</span>
    </div>
    <div style="padding: 16px 18px; border-radius: 22px; background: rgba(255,243,230,0.24); display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: 'Archivo Black', system-ui, sans-serif; font-size: 30px; line-height: 1; color: #2A1204;">7</span>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: rgba(42,18,4,0.68);">JOURS D'AFFILÉE</span>
    </div>
  </div>

  <div style="height: 22px;"></div>

  <div style="padding: 0 34px; text-align: center; font-size: 17px; font-weight: 600; line-height: 1.4; color: rgba(42,18,4,0.86); text-wrap: pretty; position: relative;">Tu viens de passer la moitié du défi.<br>1 663 pompes depuis le jour 1.</div>

  <div style="flex-grow: 1;"></div>

  <!-- mini calendrier de la série -->
  <div style="width: 100%; padding: 0 26px; display: flex; flex-direction: column; gap: 10px; position: relative;">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.8px; color: rgba(42,18,4,0.62);">TA SEMAINE</div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px;">
      <div style="aspect-ratio: 1; border-radius: 12px; background: rgba(42,18,4,0.16); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: rgba(42,18,4,0.5);">11</div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: #FFF3E6; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" style="fill: #E8460A;"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"></path></svg></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: #FFF3E6; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" style="fill: #E8460A;"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"></path></svg></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: #FFF3E6; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" style="fill: #E8460A;"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"></path></svg></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: #FFF3E6; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" style="fill: #E8460A;"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"></path></svg></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: #FFF3E6; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" style="fill: #E8460A;"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"></path></svg></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: #FFF3E6; border: 2px solid #2A1204; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" style="fill: #E8460A;"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"></path></svg></div>
    </div>
  </div>

  <div style="height: 20px;"></div>

  <div style="width: 100%; padding: 0 26px 30px 26px; display: flex; flex-direction: column; gap: 12px; position: relative;">
    <button style="height: 58px; width: 100%; border: none; border-radius: 18px; background: #2A1204; color: #FFF3E6; font-family: 'Archivo Black', system-ui, sans-serif; font-size: 16px; letter-spacing: 0.4px; cursor: pointer;">CONTINUER</button>
    <div style="height: 22px; text-align: center; font-size: 13px; font-weight: 600; color: rgba(42,18,4,0.66);">Prochain rappel demain à 07:30</div>
  </div>

</div>
</x-dc>
</body>
</html>
