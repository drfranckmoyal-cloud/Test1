<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E8460A; text-decoration: none; }
    a:hover { color: #B33507; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FDF4EB; color: #2A1204; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 22px 0 22px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Archivo Black', 'Helvetica Neue', system-ui, sans-serif; font-size: 22px; letter-spacing: -0.5px; line-height: 1;">JOUR 18</div>
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: #A2836E;">SUR 30 · 100 POMPES / JOUR</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #FFE4CE;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="stroke: #E8460A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
        <path d="M12 3c.7 3 2.4 4.1 3.8 5.6A7.5 7.5 0 0 1 18 13.8 6 6 0 0 1 6 13.8c0-2.2 1.1-3.6 2.2-5C9.6 7 10 5.3 12 3Z"></path>
      </svg>
      <span style="font-family: 'Archivo Black', system-ui, sans-serif; font-size: 14px; color: #E8460A;">6</span>
      <span style="font-size: 11px; font-weight: 600; color: #A2836E;">jours</span>
    </div>
  </div>

  <div style="margin: 18px 22px 0 22px; padding: 24px 0 26px 0; border-radius: 30px; background: #FFFFFF; box-shadow: 0 12px 30px rgba(42,18,4,0.07); display: flex; flex-direction: column; align-items: center;">
    <div style="position: relative; width: 250px; height: 250px;">
      <svg width="250" height="250" viewBox="0 0 250 250" style="transform: rotate(-90deg);">
        <circle cx="125" cy="125" r="105" fill="none" style="stroke: #FDE3D0; stroke-width: 20px;"></circle>
        <circle cx="125" cy="125" r="105" fill="none" style="stroke: #E8460A; stroke-width: 20px; stroke-linecap: round; stroke-dasharray: 659.7; stroke-dashoffset: 244.1;"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <div style="font-family: 'Archivo Black', 'Helvetica Neue', system-ui, sans-serif; font-size: 82px; line-height: 0.9; letter-spacing: -3px; color: #E8460A;">63</div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 2.4px; color: #A2836E;">SUR 100 POMPES</div>
      </div>
    </div>
    <div style="margin-top: 12px; font-size: 13px; font-weight: 700; color: #2A1204; background: #FFE4CE; padding: 8px 16px; border-radius: 999px;">37 pompes restantes</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 16px 22px 0 22px;">
    <div style="height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #F2DFCE; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #2A1204;">+1</div>
    <div style="height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #F2DFCE; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #2A1204;">+5</div>
    <div style="height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #F2DFCE; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #2A1204;">+10</div>
    <div style="height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #F2DFCE; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #2A1204;">+20</div>
  </div>

  <div style="padding: 10px 22px 0 22px;">
    <div style="height: 58px; border-radius: 18px; background: #E8460A; color: #FFF3E6; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', system-ui, sans-serif; font-size: 16px; letter-spacing: 0.4px;">ENREGISTRER UNE SÉRIE</div>
  </div>

  <div style="margin: 16px 22px 0 22px; padding: 16px 18px; border-radius: 20px; background: #FFE4CE; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #C24A12;">MOTIVATION DU JOUR</div>
    <div style="font-size: 15px; font-weight: 600; line-height: 1.35; text-wrap: pretty;">Plus que 37. C'est 3 minutes de ta journée, pas plus.</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 22px 16px 22px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #A2836E;">DÉFI 30 JOURS</span>
      <span style="font-size: 13px; font-weight: 700;">15 <span style="color: #A2836E; font-weight: 600;">/ 30 jours validés</span></span>
    </div>
    <div style="height: 10px; border-radius: 5px; background: #FDE3D0; overflow: hidden; display: flex;">
      <div style="width: 50%; background: #E8460A; border-radius: 5px;"></div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #F2DFCE; background: #FFFFFF; padding: 10px 12px 22px 12px;">
    <div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #E8460A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 13h3l2-5 3 9 2.5-6 1.5 2h4"></path></svg>
      <span style="font-size: 10px; font-weight: 700; color: #E8460A;">Aujourd'hui</span>
    </div>
    <div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #BFA694; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span style="font-size: 10px; font-weight: 700; color: #BFA694;">Calendrier</span>
    </div>
    <div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke: #BFA694; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path><path d="M10.5 20a2 2 0 0 0 3 0"></path></svg>
      <span style="font-size: 10px; font-weight: 700; color: #BFA694;">Rappels</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
