<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Pompes Challenge</title>
<meta name="description" content="Le défi quotidien : pompes, tractions, abdos. Un compteur, un calendrier, et de la motivation franchement exagérée.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="100 Pompes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDF4EB">
<style>
:root{
  --bg:#FDF4EB; --bg-deep:#FFFFFF; --surface:#FFFFFF; --surface-alt:#FDE3D0; --border:#F2DFCE;
  --text:#2A1204; --muted:#A2836E; --tab-off:#BFA694;
  --missed-fill:#F4E8DD; --missed-text:#B9A192; --up-fill:#F8EFE6; --up-text:#CDB8A7;
  --orange:#F2540B; --orange-light:#C43D06; --orange-deep:#B33507; --amber:#FF8A3D;
  --ink:#2A1204; --cream:#FFF3E6;
}
html[data-theme="dark"]{
  --bg:#14100E; --bg-deep:#100C0A; --surface:#1D1611; --surface-alt:#251C17; --border:#2A201A;
  --text:#FCF3EA; --muted:#8E7A6C; --tab-off:#6B5B50;
  --missed-fill:#221A15; --missed-text:#5C4C42; --up-fill:#1A1411; --up-text:#463A32;
  --orange:#FF6B1A; --orange-light:#FF8A3D; --orange-deep:#E8460A; --amber:#FFA33D;
}
@media (prefers-color-scheme: dark){
  html[data-theme="system"]{
    --bg:#14100E; --bg-deep:#100C0A; --surface:#1D1611; --surface-alt:#251C17; --border:#2A201A;
    --text:#FCF3EA; --muted:#8E7A6C; --tab-off:#6B5B50;
    --missed-fill:#221A15; --missed-text:#5C4C42; --up-fill:#1A1411; --up-text:#463A32;
    --orange:#FF6B1A; --orange-light:#FF8A3D; --orange-deep:#E8460A; --amber:#FFA33D;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--orange-light);text-decoration:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:22px 22px 120px 22px;
  padding-top:calc(22px + env(safe-area-inset-top))}
.hidden{display:none!important}

/* en-têtes */
.h-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-size:24px;font-weight:900;letter-spacing:-.6px;line-height:1}
.title-lg{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1}
.sub{font-size:12px;font-weight:600;letter-spacing:1.5px;color:var(--muted);margin-top:3px}
.section{font-size:11px;font-weight:700;letter-spacing:1.8px;color:var(--muted);margin:26px 0 10px}

.badge{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;
  background:color-mix(in srgb, var(--orange) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--orange) 32%, transparent);flex-shrink:0}
.badge b{font-size:14px;font-weight:900;color:var(--orange-light)}
.badge span{font-size:11px;font-weight:600;color:var(--muted)}

/* anneaux */
.rings{display:flex;gap:12px;justify-content:center;margin-top:18px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1}
.ring-box{position:relative;display:grid;place-items:center}
.ring{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--surface-alt)}
.ring-arc{fill:none;stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.3,1)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-weight:900;color:var(--orange);line-height:.95;letter-spacing:-2px}
.ring-goal{font-weight:700;color:var(--muted)}
.ring-name{font-weight:700;color:var(--muted);text-transform:uppercase}

/* cartes */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px}
.card + .card{margin-top:10px}
.motiv{margin-top:24px;border-radius:20px;padding:16px 18px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--orange) 16%,transparent),color-mix(in srgb,var(--amber) 6%,transparent));
  border:1px solid color-mix(in srgb,var(--orange) 22%,transparent)}
.motiv h4{margin:0 0 6px;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--orange-light)}
.motiv p{margin:0;font-size:15px;font-weight:600;line-height:1.35;text-wrap:pretty}

.ex-head{display:flex;align-items:center;gap:8px}
.ex-name{font-size:15px;font-weight:700}
.ex-count{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;
  border-radius:17px;background:var(--surface-alt)}
.ex-count b{font-size:17px;font-weight:900;color:var(--orange-light)}
.ex-count span{font-size:13px;font-weight:600;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface-alt);overflow:hidden;margin:12px 0}
.bar>i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--orange),var(--amber));transition:width .45s cubic-bezier(.2,.8,.3,1)}
.chips{display:flex;gap:8px}
.chip{flex:1;height:46px;border-radius:14px;background:var(--surface-alt);
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip:active{transform:scale(.97)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;
  background:var(--orange);color:var(--bg);font-size:16px;font-weight:900;letter-spacing:.4px}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:13px;
  font-weight:600;height:48px;letter-spacing:0}
.btn[disabled]{background:var(--muted);opacity:.6}

.pick{display:flex;gap:8px}
.pick button{flex:1;height:46px;border-radius:15px;background:var(--surface);border:1px solid var(--border);
  font-size:13px;font-weight:600;color:color-mix(in srgb,var(--text) 78%,transparent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.pick button.on{background:var(--orange);border-color:transparent;color:var(--bg);font-weight:700}

.total{display:flex;align-items:baseline;justify-content:space-between;margin-top:26px}
.total .lbl{font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--muted)}
.total .val{font-size:13px;font-weight:600;color:var(--muted)}
.total .val b{font-weight:700;color:var(--text)}
.bar.big{height:10px;border-radius:5px;margin-top:8px}

/* calendrier */
.legend{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.sw{width:14px;height:14px;border-radius:5px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:14px}
.day{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;position:relative;overflow:hidden}
.day.done{background:linear-gradient(160deg,var(--orange),var(--orange-deep))}
.day.done svg{width:19px;height:19px;fill:var(--cream)}
.day.done b{font-size:10px;font-weight:700;color:rgba(42,18,4,.7)}
.day.now{background:var(--surface-alt);border:2px solid var(--orange)}
.day.now b{font-size:17px;font-weight:900;color:var(--orange-light)}
.day.now span{font-size:9px;font-weight:700;color:var(--muted)}
.day.now i{position:absolute;left:0;bottom:0;height:4px;background:var(--orange);border-radius:0 2px 0 0}
.day.miss{background:var(--missed-fill);border:1px solid var(--border);color:var(--missed-text);
  font-size:15px;font-weight:700}
.day.next{background:var(--up-fill);color:var(--up-text);font-size:15px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 12px}
.stat b{display:block;font-size:20px;font-weight:900}
.stat b.hi{color:var(--orange-light)}
.stat span{display:block;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--muted)}

/* réglages */
.goal-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.goal-row .nm{font-size:14px;font-weight:600}
.stepper{margin-left:auto;display:flex;align-items:center;gap:8px}
.step{width:38px;height:38px;border-radius:13px;background:var(--surface-alt);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.stepper .v{min-width:46px;text-align:center;font-size:18px;font-weight:900;color:var(--orange-light)}
.note{border-radius:18px;padding:16px;font-size:13px;font-weight:500;line-height:1.45;
  background:color-mix(in srgb,var(--orange) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--orange) 24%,transparent)}
.note b{font-weight:700}
.slot{display:flex;align-items:center;gap:14px;margin-top:10px}
.slot .tm{font-size:19px;font-weight:900;letter-spacing:-.3px;min-width:76px}
.slot .ds{font-size:12px;font-weight:600;color:var(--muted)}

/* barre d'onglets */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg-deep);
  border-top:1px solid var(--surface-alt);padding:10px 12px calc(22px + env(safe-area-inset-bottom));
  z-index:20}
nav button{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:var(--tab-off);font-size:10px;font-weight:700}
nav button.on{color:var(--orange)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* feuilles modales */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;
  padding:22px 22px calc(24px + env(safe-area-inset-bottom));margin:0 auto;max-width:520px}
.sheet h3{margin:0;text-align:center;font-size:20px;font-weight:900}
.sheet .sh-sub{margin:4px 0 20px;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.big-step{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.big-step .step{width:52px;height:52px;border-radius:18px;font-size:20px}
.big-step .v{min-width:110px;text-align:center;font-size:44px;font-weight:900;color:var(--orange);line-height:1}
.big-step .v small{display:block;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted)}
.presets{display:flex;gap:8px;margin-top:12px}
.presets button{flex:1;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--border);
  font-size:14px;font-weight:600}
.presets button.on{background:var(--orange);border-color:transparent;color:var(--bg);font-weight:700}
.sw-row{display:flex;align-items:center;gap:12px}
.toggle{margin-left:auto;width:52px;height:32px;border-radius:16px;background:var(--surface-alt);
  position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--orange)}
.toggle i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on i{transform:translateX(20px)}
.dim{opacity:.55}

/* célébration */
#celeb{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:30px 26px calc(30px + env(safe-area-inset-bottom));
  background:linear-gradient(168deg,#FF8A3D 0%,#FF6B1A 42%,#DB3F06 100%);color:#2A1204;overflow-y:auto}
#celeb .star{width:168px;height:168px;border-radius:50%;background:rgba(255,243,230,.2);
  display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
#celeb .star div{width:136px;height:136px;border-radius:50%;background:rgba(255,243,230,.28);
  display:grid;place-items:center}
#celeb .star svg{width:76px;height:76px;fill:#FFF3E6}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#celeb .kicker{margin-top:26px;font-size:13px;font-weight:700;letter-spacing:3px;color:rgba(42,18,4,.62)}
#celeb .big{font-size:58px;font-weight:900;letter-spacing:-2.4px;line-height:1.08;padding-top:2px}
#celeb .sum{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}
#celeb .sum span{padding:0 14px;height:40px;display:flex;align-items:center;border-radius:20px;
  background:rgba(255,243,230,.32);font-size:14px;font-weight:700}
#celeb .msg{margin-top:22px;font-size:17px;font-weight:600;line-height:1.4;color:rgba(42,18,4,.86);
  white-space:pre-line;text-wrap:pretty}
#celeb .go{margin-top:28px;width:100%;max-width:420px;height:58px;border-radius:18px;background:#2A1204;
  color:#FFF3E6;font-size:16px;font-weight:900;letter-spacing:.4px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"></nav>
<div id="sheet"></div>
<div id="celeb" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
